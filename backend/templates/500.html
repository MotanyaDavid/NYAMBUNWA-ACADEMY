<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error | Nyambunwa Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; background: #f8f9fa; color: #333; text-align: center;
        }
        .error-container { padding: 2rem; max-width: 500px; }
        h1 { font-family: 'Playfair Display', serif; font-size: 6rem; color: #DC3545; }
        h2 { font-size: 1.5rem; margin-bottom: 1rem; color: #1A3C6E; }
        p { color: #666; margin-bottom: 2rem; line-height: 1.6; }
        a { display: inline-block; padding: 12px 30px; background: #1A3C6E; color: #fff;
            text-decoration: none; border-radius: 6px; font-weight: 600; transition: background 0.3s; }
        a:hover { background: #122850; }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>500</h1>
        <h2>Internal Server Error</h2>
        <p>Something went wrong on our end. Our team has been notified and we're working to fix it. Please try again later.</p>
        <a href="/">Return to Homepage</a>
    </div>
</body>
</html>
